<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Sign in — Ultra VIS</title>
  <link rel="stylesheet" href="/css/ultravis.css">
</head>
<body class="gate-page">
  <main class="access-shell" aria-labelledby="access-title">
    <a class="wordmark access-wordmark" href="https://skillland-platform-yuri386.onrender.com/" aria-label="SkillLand home">
      <span class="wordmark-leaf" aria-hidden="true"></span>SkillLand
    </a>
    <section class="access-card">
      <div class="access-orbit" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p class="eyebrow">ULTRA VIS</p>
      <h1 id="access-title">See the next move.</h1>
      <p class="access-copy">Ultra VIS is your private space for turning ambition into a clear career direction.</p>
      <a class="button button-primary access-button" href="/auth/skillland">Sign in via SkillLand <span aria-hidden="true">→</span></a>
      <p class="access-note">An active SkillLand account is required to continue.</p>
      <p class="access-error" id="accessError" role="alert" hidden></p>
    </section>
  </main>
  <script>
    const error = new URLSearchParams(location.search).get('error');
    const messages = {
      'skillland-session-expired': 'Your SkillLand session expired. Please sign in again.',
      'skillland-account-error': 'We could not prepare your Ultra VIS profile. Please try again.'
    };
    if (messages[error]) { const el = document.getElementById('accessError'); el.textContent = messages[error]; el.hidden = false; }
  </script>
</body>
</html>
