<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Войти — Ultra VIS</title>
  <link rel="stylesheet" href="/css/ultravis.css">
  <link rel="stylesheet" href="/css/ultravis-immersive.css">
</head>
<body class="gate-page ultra-vis-dark">
  <main class="ultra-gate" aria-labelledby="access-title">
    <picture class="ultra-gate-media">
      <source media="(max-width: 720px)" srcset="/assets/images/ultravis-hero-mobile-v3.png">
      <img src="/assets/images/ultravis-hero-desktop-v3.png" alt="">
    </picture>
    <div class="ultra-product-bar" aria-label="Ultra VIS">
      <span class="ultra-home-label">Ultra VIS</span>
      <a class="ultra-close-button" href="https://skillland-platform-yuri386.onrender.com/" aria-label="Закрыть Ultra VIS">×</a>
    </div>
    <section class="ultra-gate-copy">
      <p>Ultra VIS — личное пространство обучения, связанное с SkillLand.</p>
      <h1 id="access-title">Продолжить свой путь.</h1>
      <a class="ultra-gate-action" href="/auth/skillland">Войти через SkillLand <span aria-hidden="true">↗</span></a>
      <p class="access-error" id="accessError" role="alert" hidden></p>
    </section>
  </main>
  <script>
    const error = new URLSearchParams(location.search).get('error');
    const messages = {
      'skillland-session-expired': 'Сессия SkillLand завершилась. Войдите ещё раз.',
      'skillland-account-error': 'Не удалось подготовить профиль Ultra VIS. Попробуйте ещё раз.'
    };
    if (messages[error]) { const el = document.getElementById('accessError'); el.textContent = messages[error]; el.hidden = false; }
  </script>
  <script src="/js/ultravis-i18n.js"></script>
  <script src="/js/ultravis-motion.js"></script>
</body>
</html>
