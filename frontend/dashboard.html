<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ultra VIS &mdash; Учись и выбирай свой путь</title>
  <link rel="stylesheet" href="/css/ultravis.css">
  <link rel="stylesheet" href="/css/ultravis-product.css">
</head>
<body class="vis-product-page">
  <header class="vis-header">
    <a class="wordmark" href="/dashboard" aria-label="Ultra VIS"><span class="vis-mark" aria-hidden="true"></span>Ultra VIS</a>
    <nav class="vis-nav" aria-label="Разделы">
      <button data-view="home">Главная</button><button data-view="lectures">Лекции</button><button data-view="colleges">Профориентация</button><button data-view="day">Мой день</button>
    </nav>
    <div class="vis-header-actions"><button class="plain-action" data-view="profile">Профиль</button><button class="logout-button" id="logoutButton" type="button">Выйти</button></div>
  </header>

  <main>
    <section class="vis-hero" id="hero">
      <img src="/assets/images/ultravis-hero-v2.png" alt="Студент с телефоном открывает образовательный план">
      <div class="vis-hero-copy">
        <p class="eyebrow">УЛЬТРАВИЗУАЛЬНЫЙ ПУТЬ К ЗНАНИЯМ</p>
        <h1>Знания. Выбор.<br><span>Твой следующий шаг.</span></h1>
        <p>Лекции, профильные направления, заметки и ежедневные задачи &mdash; всё в одном личном пространстве.</p>
        <div class="hero-actions"><button class="button button-light" data-view="lectures">Открыть лекции <span>&rarr;</span></button><button class="hero-text-button" data-view="colleges">Выбрать направление</button></div>
      </div>
    </section>
    <section class="vis-workspace" id="workspace" aria-live="polite"></section>
  </main>
  <footer class="footer vis-footer"><span>&copy; 2026 SkillLand</span><span>Ultra VIS &mdash; твоя образовательная траектория.</span></footer>
  <script src="/js/ultravis-app.js"></script>
  <script src="/js/ultravis-dashboard.js"></script>
</body>
</html>
