<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ultra VIS — учись и выбирай свой путь</title>
  <link rel="stylesheet" href="/css/ultravis.css">
  <link rel="stylesheet" href="/css/ultravis-product.css">
  <link rel="stylesheet" href="/css/ultravis-learning.css">
  <link rel="stylesheet" href="/css/ultravis-theme-library.css">
  <link rel="stylesheet" href="/css/ultravis-ai.css">
  <link rel="stylesheet" href="/css/ultravis-themes.css">
</head>
<body class="vis-product-page">
  <header class="vis-header">
    <a class="wordmark" href="/dashboard" aria-label="Ultra VIS"><span class="vis-mark" aria-hidden="true"></span>Ultra VIS</a>
    <nav class="vis-nav" aria-label="Разделы">
      <button data-view="home">Главная</button><button data-view="lectures">Лекции</button><button data-view="colleges">Направление</button><button data-view="day">Мой день</button><button data-view="quotes">Идеи</button>
    </nav>
    <div class="vis-header-actions"><button class="plain-action" data-view="themes">Тема</button><button class="plain-action" data-view="profile">Профиль</button><button class="logout-button" id="logoutButton" type="button">Выйти</button></div>
  </header>

  <main>
    <section class="vis-hero" id="hero">
      <img src="/assets/images/ultravis-hero-v2.png" alt="Студент с телефоном открывает образовательный план">
      <div class="vis-hero-copy">
        <p class="eyebrow">УЛЬТРАВИЗУАЛЬНЫЙ ПУТЬ К ЗНАНИЯМ</p>
        <h1>Знания. Выбор.<br><span>Твой следующий шаг.</span></h1>
        <p>Большие лекции, личный прогресс, выбор направления и связь с профилем SkillLand — в одном спокойном пространстве.</p>
        <div class="hero-actions"><button class="button button-light" data-view="lectures">Открыть лекции <span aria-hidden="true">→</span></button><button class="hero-text-button" data-view="quiz">Найти свой ориентир</button></div>
      </div>
    </section>
    <section class="vis-workspace" id="workspace" aria-live="polite"></section>
  </main>
  <div class="ultra-ai-dock" id="ultraAiDock">
    <form class="ultra-ai-composer" id="ultraAiForm">
      <button class="ultra-ai-toggle" id="ultraAiToggle" type="button" aria-expanded="false" aria-label="Открыть Ultra VIS AI"><span>Ultra VIS AI</span></button>
      <input id="ultraAiInput" type="text" autocomplete="off" placeholder="Спроси Ultra VIS AI" aria-label="Сообщение для Ultra VIS AI">
      <button class="ultra-ai-send" type="submit" aria-label="Отправить сообщение">Отправить</button>
    </form>
  </div>
  <div class="ultra-ai-backdrop" id="ultraAiBackdrop" aria-hidden="true"></div>
  <section class="ultra-ai-chat" id="ultraAiChat" aria-live="polite" aria-label="Диалог с Ultra VIS AI">
    <div class="ultra-ai-chat-head"><div><p class="eyebrow">ULTRA VIS AI</p><strong>Твой учебный помощник</strong></div><button id="ultraAiClose" type="button">Свернуть</button></div>
    <div class="ultra-ai-messages" id="ultraAiMessages"></div>
  </section>
  <footer class="footer vis-footer"><span>© 2026 SkillLand</span><span>Ultra VIS — твоя образовательная траектория.</span></footer>
  <script src="/js/ultravis-app.js"></script>
  <script src="/js/ultravis-dashboard.js"></script>
  <script src="/js/ultravis-ai.js"></script>
</body>
</html>
