<!-- Модальное окно входа -->
<div class="modal" id="loginModal">
    <div class="modal-content">
        <span class="modal-close" onclick="document.getElementById('loginModal').classList.remove('active')">&times;</span>
        <h2 class="modal-title">Вход в аккаунт</h2>
        
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="loginUsername" required class="form-input">
            </div>
            
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" required class="form-input">
            </div>
            
            <button type="submit" class="btn-primary btn-block">Войти</button>
        </form>
        
        <p class="auth-switch">
            Нет аккаунта? <a href="#" onclick="document.getElementById('loginModal').classList.remove('active'); document.getElementById('registerModal').classList.add('active');">Зарегистрироваться</a>
        </p>
    </div>
</div>

<!-- Модальное окно регистрации -->
<div class="modal" id="registerModal">
    <div class="modal-content modal-large">
        <span class="modal-close" onclick="document.getElementById('registerModal').classList.remove('active')">&times;</span>
        <h2 class="modal-title">Регистрация</h2>
        
        <form id="registerForm" class="auth-form">
            <!-- Личные данные -->
            <div class="form-row">
                <div class="form-group">
                    <label>Имя *</label>
                    <input type="text" id="regFirstName" required class="form-input">
                </div>
                <div class="form-group">
                    <label>Фамилия *</label>
                    <input type="text" id="regLastName" required class="form-input">
                </div>
            </div>

            <!-- Тип пользователя -->
            <div class="form-group">
                <label>Кто ты? *</label>
                <select id="regUserType" required class="form-input">
                    <option value="">Выбери тип</option>
                    <option value="schoolkid">Школьник</option>
                    <option value="college_student">Студент колледжа</option>
                    <option value="university_student">Студент ВУЗа</option>
                    <option value="employee">Работодатель</option>
                </select>
            </div>

            <!-- Возраст и курс/класс -->
            <div class="form-row">
                <div class="form-group">
                    <label>Возраст</label>
                    <input type="number" id="regAge" min="5" max="100" class="form-input">
                </div>
                <div class="form-group">
                    <label>Класс/Курс</label>
                    <input type="text" id="regGrade" placeholder="например: 11 класс" class="form-input">
                </div>
            </div>

            <!-- Учётные данные -->
            <div class="form-row">
                <div class="form-group">
                    <label>Логин *</label>
                    <input type="text" id="regNickname" required class="form-input">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="regEmail" required class="form-input">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Пароль *</label>
                    <input type="password" id="regPassword" required class="form-input">
                    <small>Минимум 6 символов</small>
                </div>
                <div class="form-group">
                    <label>Подтверди пароль *</label>
                    <input type="password" id="regPasswordConfirm" required class="form-input">
                </div>
            </div>
            
            <button type="submit" class="btn-primary btn-block">Зарегистрироваться</button>
        </form>
        
        <p class="auth-switch">
            Уже есть аккаунт? <a href="#" onclick="document.getElementById('registerModal').classList.remove('active'); document.getElementById('loginModal').classList.add('active');">Войти</a>
        </p>
    </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
